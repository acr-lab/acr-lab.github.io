talks:
  - date: 2026-10-22
    time: "9:00 – 11:00"
    location: "Room C102, VIASM"
    speaker: "Nam Tran"
    affiliation: "University of Wollongong"
    title: "Compact Lattice-Based NIZK Arguments for Set Membership and Ring Signatures without RO"
    abstract: |
      Zero-knowledge proofs of set membership underpin privacy-preserving constructions such as ring signatures and anonymous credentials. Existing succinct constructions rely mainly on the Fiat--Shamir transform in the Random Oracle Model (ROM), while standard-model non-interactive proofs from post-quantum assumptions remain either generic and inefficient or asymptotically compact yet concretely impractical.

      This talk introduces a compact lattice-based NIZK arguments for set membership in the standard model with proof size logarithmic in the set cardinality. The construction matches the logarithmic proof size of accumulator-based ROM constructions while achieving post-quantum security without random oracles. The main technical tool is a new trapdoor Σ-protocol (Canetti et al., STOC'19) supporting linear relations modulo multiple heterogeneous moduli, allowing such relations to be handled at their native moduli without homogenization. This yields a modular approach to compact proofs compatible with lattice accumulators. A direct application is a logarithmic-size lattice-based ring signature scheme with provable security under standard lattice assumptions.
    bio: |
      Nam Tran is a PhD candidate at the University of Wollongong, under the supervision of Distinguished Prof. Willy Susilo and Associate Prof. Khoa Nguyen. His research interests include post-quantum digital signatures with advanced privacy-preserving features, and (sometimes) cryptanalysis of hard lattice/code-based problems.
    paper: "https://ia.cr/2026/1885"

  - date: 2026-09-24
    time: "14:00 – 15:30"
    location: "Room C102, VIASM"
    speaker: "Thai Hung Le"
    affiliation: "Télécom Paris and École normale supérieure-PSL, France"
    title: "Recent progress in cryptanalysis of multivariate-based cryptography"
    abstract: |
      Post-quantum cryptography aims to develop cryptographic schemes secure against quantum adversaries. One promising class of digital signature schemes is based on multivariate quadratic equations, of which Unbalanced Oil and Vinegar (UOV) is a leading example. UOV has been extensively studied since its introduction in 1998, and it has remained secure. It offers very small signatures but suffers from very large public keys. To address this issue, some variants, such as MAYO, QR-UOV, and SNOVA, introduce additional structure to reduce the size of the public key. These four multivariate signature schemes are among the candidates in the Third round of NIST’s Additional Call for Post-Quantum Digital Signature Schemes. In this talk, we revisit recent cryptanalytic efforts targeting UOV and its variants, in particular the wedge attack [1] and subsequent extensions [2, 3, 4]. We will discuss the main ideas behind these attacks and their implications for multivariate cryptography.
    bio: |
      Thai Hung LE is a PhD student at Télécom Paris and École normale supérieure-PSL, France. His research focuses on the algebraic cryptanalysis of post-quantum cryptography.
    papers:
      - "https://eprint.iacr.org/2025/1143.pdf"
      - "https://eprint.iacr.org/2026/298"
      - "https://eprint.iacr.org/2026/237"
      - "https://eprint.iacr.org/2026/1620"

  - date: 2026-08-14
    time: "10:00 – 11:30"
    location: "Room C102, VIASM"
    speaker: "Phuoc Van Long Pham"
    affiliation: "Brown University, USA"
    title: "Survey for Reed-Solomon List Decoding and related topics"
    abstract: |
      Since the Stone Age, people have already known that any polynomial of degree d has at most d real solutions, but over finite fields, everything is still chaos. It takes a long time until the Age of Enlightenment, that Lagrange sets his first steps onto the land of finite fields with his theorem, stating that a polynomial of degree d over any finite field still has at most d roots (Lagrange does not even know what is finite field at the time!). Building on this crucial property of polynomials, Irving Reed and Gustave Solomon bring its influence from number theory all the way to information theory, by inventing the Reed-Solomon code. They also did not know at the time that this code became so influential in a field called Zero Knowledge Proofs, especially its list decoding property. Most parameter regimes for list decoding have been explored, by famous algorithms from Berlekamp-Welch to Guruswami-Sudan, but there is still one unknown range, that is from the Johnson Bound 1 − √R to the code capacity 1 − R. This talk acts as a small survey to introduce the techniques of these algorithms, and also introduce the list decoding (open) problem beyond the Johnson bound. There also happens to have a prize tag by the Ethereum Foundation for solving it.

  - date: 2026-07-30
    time: "15:30 – 16:30"
    location: "Room A204, VIASM"
    speaker: "Duy Nguyen"
    affiliation: "Telecom Paris, France"
    title: "Splitting Bilinear Groups: New Translations from Composite- to Prime-Order with Applications to Batch Arguments for NP"
    abstract: |
      Bilinear groups, also known as pairing groups, are a versatile tool that enables many efficient cryptographic constructions. Among bilinear groups, those with a composite order (𝑁 = 𝑝 ∙ 𝑞 for two large, secret primes 𝑝, 𝑞) offer an additional algebraic structure which is advantageous in many applications. They are however dramatically less efficient than their prime-order counterparts, so multiple translation frameworks for constructions from composite- to prime-order groups have been introduced in the literature.

      Motivated by the recent construction of Batch Arguments for NP (BARGs) with linear-size CRS by Chen, Elias and Wu [Asiacrypt ’25], based on composite-order groups, we notice that these previous frameworks fail to transfer their scheme to the prime-order setting. In this work, we identify and close this gap by introducing a new translation framework based on a new abstraction called dual encodings. The crucial feature of these objects is a security property called indistinguishability that allows embedding hidden subgroups, emulating composite-order groups more faithfully and thus enabling more powerful translations. Then, we realize dual encodings using functional encryption for function-hiding inner products. Finally, we apply our framework to build the first BARG with linearsize CRS from prime-order groups, while preserving the (statistical) somewhere extractability of previous constructions. Our result represents a significant step toward practically efficient BARGs and showcases a surprising application of functional encryption which we find of independent interest.

      This is a joint work with David Balbás (ETH Zurich) and Dario Fiore (IMDEA Software Institute).
    paper: "https://ia.cr/2026/1564"
