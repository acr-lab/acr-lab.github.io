series:
  - name: "2026 Latticed Based Cryptography Weekly"
    title: "Introduction to Lattice"
    speaker: "The seminar members take turns presenting each week."
    time: "14:00 – 16:00"
    location: "Room C101, VIASM"
    mode: "In person"
    abstract: |
      Post-quantum cryptography aims to develop cryptographic schemes secure against quantum adversaries. Lattice-based cryptography is currently its most prominent approach, and it is the basis of NIST's standard for key encapsulation, Kyber (ML-KEM). In this talk, we revisit the foundations of this area following the book A Gentle Introduction to Lattice-Based Cryptography by Alfred Menezes. We start from lattices and their basic problems (SVP and CVP), then introduce the Short Integer Solution (SIS) and Learning With Errors (LWE) problems, and show how LWE yields a simple public-key encryption scheme. We then see how this idea leads to Kyber, and how lattice basis reduction (LLL and BKZ) is used to attack these problems and choose parameters. The talk is introductory and requires only linear algebra and basic probability.
    sessions:
      - 2026-10-09
      - 2026-10-16
      - 2026-10-23
      - 2026-10-30
      - 2026-11-06
